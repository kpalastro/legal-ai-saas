name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: lexsim }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - name: Apply auth-schema stub to CI postgres (dev mount isn't available here)
        run: python3 infra/scripts/install_auth_stub.py
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: uv sync --group dev
        working-directory: apps/api
      - run: uv run ruff check . && uv run mypy app
        working-directory: apps/api
      - run: uv run alembic upgrade head
        working-directory: apps/api
        env:
          # CI service container publishes postgres on :5432 (not dev :5434);
          # settings read DATABASE_URL directly (no env prefix)
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lexsim
      - name: Apply app-role grants (tables/sequences now exist)
        run: python3 infra/scripts/install_auth_stub.py --grants-only
      # Gates G6/G3/C6 now; G1/G2/G5 (DB/RLS) + G7 (AustLII deny-list) wire up in next PRs.
      - run: uv run pytest --cov=app --cov-fail-under=80
        working-directory: apps/api
        env:
          # CI service postgres is :5432 (dev compose uses :5434); conftest defaults
          # to the dev port so local runs work out of the box
          LEXSIM_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lexsim
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lexsim
      # G8 stub: assert no cross-region Bedrock model IDs anywhere in the repo
      - name: G8 — no cross-region inference routing (APP 8)
        run: |
          ! grep -rE '"(global|apac|us|eu)\.' apps/api/app apps/api/worker \
            && echo "G8 pass: all model IDs regional"
  # Pending item #4: fail CI when a running api container serves code that diverges
  # from git HEAD (the stale-container gap that bit twice on 31 Aug).
  drift:
    runs-on: [self-hosted, macOS]   # needs local docker + running stack
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Drift check — container vs working tree
        # Runner checkout is a different clone: compare container against
        # apps/api *from the checked-out ref* by re-pointing the script's cd.
        env:
          DRIFT_TREE: ${{ github.workspace }}/apps/api
        run: infra/scripts/drift_check.sh
